<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choose a new password · Prisma</title>
<meta name="description" content="Choose a new password for your Prisma account.">
<meta name="theme-color" content="#0a0406">
<meta property="og:title" content="Choose a new password · Prisma">
<meta property="og:description" content="Choose a new password for your Prisma account.">
<link rel="icon" href="assets/icon-64.png" type="image/png">
<link rel="stylesheet" href="style.css?v=3">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js" defer></script>
<script src="config.js" defer></script>
<script src="app.js?v=3" defer></script>
</head>
<body data-page="reset">
<header class="site"></header>
<main>
<div class="wrap auth"><div class="card"><h1>Choose a new password</h1><p class="sub">Pick something you don't use anywhere else.</p>
<div id="msg" class="msg" hidden role="alert"></div>
<form id="form">
  <label>New password<input type="password" name="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"></label>
  <label>Confirm new password<input type="password" name="confirm" autocomplete="new-password" required></label>
  <button class="btn" type="submit">Save password</button>
</form>
</div></div>
</main>
<footer class="site"></footer>
</body>
</html>
